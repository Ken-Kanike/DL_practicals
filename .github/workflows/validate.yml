name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --upgrade pip nbformat

      - name: Validate notebook JSON and syntax
        run: python scripts/validate_notebooks.py

      - name: Scan for accidental secrets
        run: python scripts/check_for_secrets.py
